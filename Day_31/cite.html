<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cite Element</title>
</head>
<body>
    
    <p>My favorite book is <cite>Wings of Fire</cite>.</p>

    <p>I watched the movie <cite>3 Idiots</cite>.</p>

    <p>I am learning from <cite>HTML in 50 Days</cite>.</p>

    <p>Book: <cite>Rich Dad Poor Dad</cite></p>

    <p>I am learning: <cite>HTML</cite></p>

    <p>The word <i>homo sapiens</i> is Latin.</p>

    <p>You must <em>practice</em> every day.</p>

</body>
</html>
