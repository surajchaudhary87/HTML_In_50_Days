<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisyration Form</title>
</head>
<body>
    
    <h1>Registration Form</h1>

    <hr>

    <form action="">

        <label for="name">Name:</label>
        <input type="text" name="name" id="name" placeholder="Enter your name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter your email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password" placeholder="Enter your password" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="male" value="male" required>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female" required>
        <label for="female">Female</label><br><br>

        <label for="Age">Age:</label>
        <input type="number" name="age" id="age" placeholder="Enter your age" required><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" id="dob" required><br><br>

        <label for="country">Country:</label>
        <select name="country" id="country" required>
            <option value="">Select your country</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="canada">Canada</option>
        </select><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
