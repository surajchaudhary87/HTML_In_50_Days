<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Table</title>
</head>
<body>
    
    <h1>Student table</h1>
    
    <hr>

    <table border="1">
        <thead>
            <th>
                Name
            </th>
            <th>
                Hindi
            </th>
            <th>
                English
            </th>
            <th>
                Total
            </th>
        </thead>

        <tbody>
            <tr>
                <td>Suraj</td>
                <td>95</td>
                <td>98</td>
                <td>193</td>
            </tr>

            <tr>
                <td>Rohan</td>
                <td>90</td>
                <td>90</td>
                <td>180</td>
            </tr>

            <tr>
                <td>Seeta</td>
                <td>85</td>
                <td>85</td>
                <td>170</td>
            </tr>
        </tbody>

        <tfoot>
            <tr >
                <td colspan="3" >Total Summary</td>
                <td>95%</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
