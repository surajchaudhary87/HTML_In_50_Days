<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Inret Attribute</title>
</head>
<body>

    <h1>HTML Inert Example</h1>

    <hr>
    
    <section inert>
        <h2>Inactive Section</h2>

        <p>This section is inactive.</p>

        <button>Click Me</button>

        <input type="text" placeholder="Enter your name">
    </section>

    <section>
        <h2>Active Section</h2>

        <p>This section is working normally.</p>

        <button>Click Me</button>
    </section>
</body>
</html>
