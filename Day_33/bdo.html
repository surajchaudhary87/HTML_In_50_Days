<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML bdo Element</title>
</head>
<body>
    
    <!-- Bydirectional Override -->
    <!-- dir="ltr" = Left to Right -->
    <!-- dir="rtl" = Right to Left -->

    <p>Normal text: Hello World</p>

    <p>
    Left to right:
        <bdo dir="ltr">Hello World</bdo>
    </p>

    <p>
    Right to left:
        <bdo dir="rtl">Hello World</bdo>
    </p>

    <p>
    My Name: 
        <bdo dir="ltr">Suraj Chaudhary</bdo>
    </p>

    <p>My Name:
        <bdo dir="rtl">Suraj Chaudhary</bdo>
    </p>

</body>
</html>
