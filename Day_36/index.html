
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Learning the HTML noscript element">
    <title>HTML Noscript</title>
</head>
<body>

    <header>
        <h1>My Learning Website</h1>
    </header>

    <main>
        <section>
            <h2>Welcome!</h2>
            <p>This is my HTML learning website.</p>
        </section>

        <section>
            <h2>JavaScript Availability</h2>

            <noscript>
                <p>
                    JavaScript is disabled in your browser.
                    Please enable JavaScript for the best experience.
                </p>
            </noscript>

            <p>
                If JavaScript is enabled, this page can use
                JavaScript-based features.
            </p>
        </section>
    </main>

    <footer>
        <p>Created during my 50 Days HTML Learning Challenge.</p>
        <p>Created by Suraj Chaudhary</p>
    </footer>

</body>
</html>
