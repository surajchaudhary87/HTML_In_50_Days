<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML noscript Tag</title>
</head>
<body>
    
    <h1>Welcome to My Website</h1>

    <hr>
    <!-- noscript =  HTML tag hai jo tab content display karta hai jab browser mein JavaScript disabled ho, ya browser JavaScript support na karta ho.-->
    <noscript>
        <p>Please enable JavaScript to use this website.</p>
    </noscript>

    <noscript>
        <p>
            JavaScript is disabled in your browser.
            Please enable JavaScript.
        </p>
    </noscript>

    <footer>
        <p>This is example of noscript tag</p>
    </footer>


</body>
</html>
