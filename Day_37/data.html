<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Data attributes</title>
</head>
<body>
    

    <header>
        <h1>HTML Data atrributes example</h1>
    </header>
    <hr>


    <main>
        <p data-name="Suraj">Welcome!</p>

        <div data-user-id="101">Student</div>

        <button data-course="HTML">Learn Now</button>

        <p data-level="beginner">HTML Course</p>


        <section>
            <h2>Student Details</h2>

            <article data-student-id="101"
                     data-course="BCA"
                     data-year="Second">

                <h3>Student 1</h3>
                <p>Name: Rahul</p>
                <p>Course: BCA</p>
            </article>

            <hr>

            <article data-student-id="102"
                     data-course="BBA"
                     data-year="First">

                <h3>Student 2</h3>
                <p>Name: Priya</p>
                <p>Course: BBA</p>
            </article>

        </section>
    </main>



</body>
</html>
