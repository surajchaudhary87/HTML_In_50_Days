
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 37 - Data Attributes</title>
</head>
<body>

    <header>
        <h1>Student Information</h1>
        <p>Learning HTML data attributes</p>
    </header>

    <hr>

    <main>
        <section>
            <h2>Student Details</h2>

            <article data-student-id="101"
                     data-course="BCA"
                     data-year="Second">

                <h3>Student 1</h3>
                <p>Name: Rahul</p>
                <p>Course: BCA</p>
            </article>


            <article data-student-id="102"
                     data-course="BBA"
                     data-year="First">

                <h3>Student 2</h3>
                <p>Name: Priya</p>
                <p>Course: BBA</p>
            </article>

        </section>
    </main>

    <footer>
        <p>Created for Day 37 HTML Learning</p>
    </footer>

</body>
</html>
