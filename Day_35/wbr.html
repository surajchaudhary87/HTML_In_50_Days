<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Break Opportunity</title>
</head>
<body>
    
    <!-- wbr =  Word Break Opportunity, Iska use long text ke andar ek aisi jagah batane ke liye hota hai jahan browser zaroorat padne par line break kar sakta hai.-->

    <p>
        ThisIsAVeryLongWord<wbr>ThatCanBreak<wbr>IfNeeded
    </p>

    <p>Hello<br>World</p>

    <p>
        SuperLongWebsiteAddress<wbr>.com<wbr>/products<wbr>/details
    </p>


    <p>
        Product Code:
        ABCDEFGHIJ<wbr>1234567890<wbr>XYZ
    </p>

    <p>
        Website:
        www.example<wbr>.com<wbr>/learning<wbr>/html
    </p>
    
</body>
</html>
