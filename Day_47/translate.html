<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translate Attribute</title>
</head>
<body>

    <h1 translate="yes">Welcome to My Website</h1>

    <p translate="yes">
        Learn HTML step by step.
    </p>

    <p translate="no">
        Suraj Chaudhary
    </p>

    <p translate="yes">Good Morning</p>


    <h2 translate="no">Duniya Dekho Tour And Travels</h2>

    <p translate="no">JavaScript</p>

    <div translate="yes">
        <p>This text can be translated.</p>

        <p translate="no">HTML</p>
    </div>

</body>
</html>
