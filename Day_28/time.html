<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Time Elements</title>
</head>
<body>
    
    <p>Trip Date: <time datetime="2026-12-25">25 December 2026</time></p>

    <time datetime="2026-10-23">23 October 2026</time>

    <p>Full date: <time datetime="2026-10-23">23 October 2026</time></p>

    <p>Month and year: <time datetime="2026-10">October 2026</time></p>

    <p>Time: <time datetime="14:30">2:30 PM</time></p>

    <p>Date and time: <time datetime="2026-12-25T14:30">25 December, 2:30 PM</time></p>

    <p>Travel duration: <time datetime="PT5H">5 hours</time></p>

</body>
</html>
