<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Practice Example</title>
</head>
<body>
    <header>
        <h1>Multilingual Information Page</h1>
        <p>Learn about different text directions.</p>
    </header>

    <main>

        <section>
            <h2>English – Left to Right</h2>

            <p dir="ltr">
                Welcome to my multilingual website.
            </p>
        </section>

        <section>
            <h2>Arabic – Right to Left</h2>

            <p lang="ar" dir="rtl">
                مرحبا بك في موقعي
            </p>
        </section>

        <section>
            <h2>Hindi – Left to Right</h2>

            <p lang="hi" dir="ltr">
                मेरी वेबसाइट पर आपका स्वागत है।
            </p>
        </section>
</body>
</html>
