<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draggable Attribute</title>
</head>
<body>

    <!-- draggable ek global HTML attribute hai. Isse kisi element ko drag karne ki permission di jaati hai. -->
    <header>
        <h1>HTML Draggable Attributes</h1>
    </header>

    <hr>

    <body>


        <h2 draggable="true">
            You can drag this heading.
        </h2>

        <p draggable="false">
            You cannot drag this paragraph.
        </p>

        <p draggable="true">
            Drag this text.
        </p>

    </body>
    
</body>
</html>
