<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Accesskey Attribute</title>
</head>
<body>
    <!-- accesskey ki help se user keyboard par ek particular key press karke kisi element ko quickly access kar sakta hai. -->

    <h1>HTML Accesskey</h1>

    <label for="username">Username:</label>
    <input type="text" id="username" accesskey="u">

    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" accesskey="e">

    <br><br>

    <a href="https://www.google.com" accesskey="g">
        Open Google
    </a>
    <br><br>
    <button accesskey="s">Save</button>

    
</body>
</html>
