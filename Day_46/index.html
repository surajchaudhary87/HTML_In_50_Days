
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Shortcut Form</title>
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Use keyboard shortcuts to access form fields.</p>
    </header>

    <main>

        <h2>Available Shortcuts</h2>

        <ul>
            <li>Alt + N: Name field</li>
            <li>Alt + E: Email field</li>
            <li>Alt + P: Phone field</li>
            <li>Alt + S: Submit button</li>
        </ul>

        <form action="#" method="post">

            <fieldset>
                <legend>Student Details</legend>

                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name"
                       accesskey="n" required>
                <br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email"
                       accesskey="e" required>
                <br><br>

                <label for="phone">Phone:</label><br>
                <input type="tel" id="phone" name="phone"
                       accesskey="p" required>
                <br><br>

                <button type="submit" accesskey="s">
                    Submit Registration
                </button>

                <button type="reset" accesskey="r">
                    Reset Form
                </button>

            </fieldset>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Student Registration</p>
        <p>Created by Suraj Chaudhary</p>
    </footer>

</body>
</html>
